aid: kry-livi
name: KRY | LIVI
description: 'KRY International AB is Europe''s largest digital-first healthcare provider, founded in
  Stockholm in 2015 by Johannes Schildt. It delivers primary and specialist care through a mobile and
  web app — video and chat consultations with doctors, nurses, psychologists and physiotherapists —
  combined with a network of physical clinics. The company trades as KRY in Sweden, Norway and Germany
  and as Livi in the United Kingdom and France, and reports more than 14 million patient appointments,
  4,000+ healthcare professionals and 60+ clinics. Alongside consumer care it sells digital clinical
  capacity to public payers (including the NHS and Swedish regions), employers, insurers and Employee
  Assistance Programmes. KRY publishes no public developer portal, API reference or SDKs; its consumer
  and partner surfaces are app- and contract-based, and patient authentication in Sweden runs on BankID.'
